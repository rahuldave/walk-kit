# The website of walk-kit: on every push to main that changes docs/, smalldocs builds docs/ and GitHub Pages
# publishes it at https://rahuldave.com/walk-kit/. In the repository's settings on GitHub, under Pages, set the
# source to GitHub Actions once.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write  # to publish the site
  id-token: write  # to prove to Pages that this workflow is the one publishing

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --from 'smalldocs>=0.1.5' smalldocs render docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
